<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --text: #333333;
      --primary: #4a90e2;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      background: var(--surface);
      width: 100%;
      max-width: 600px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      padding: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .note-input-wrapper {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .notes-list {
      list-style: none;
    }

    .note-item {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.3s;
    }

    .note-item:last-child {
      border-bottom: none;
    }

    .delete-btn {
      background: transparent;
      color: #ff4d4f;
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
    }

    .delete-btn:hover {
      background: rgba(255, 77, 79, 0.1);
      color: #ff4d4f;
    }

    .empty-state {
      text-align: center;
      color: #888;
      padding: 2rem 0;
      font-style: italic;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Quick Notes</h1>
    
    <div class="note-input-wrapper">
      <input type="text" id="noteInput" placeholder="Tulis sesuatu untuk diingat..." autocomplete="off">
      <button id="addBtn">Simpan</button>
    </div>

    <ul class="notes-list" id="notesList">
      <li class="empty-state" id="emptyState">Belum ada catatan hari ini.</li>
    </ul>
  </div>

  <script>
    const noteInput = document.getElementById('noteInput');
    const addBtn = document.getElementById('addBtn');
    const notesList = document.getElementById('notesList');
    const emptyState = document.getElementById('emptyState');

    // LocalStorage key
    const STORAGE_KEY = 'quick_notes_fake_db';

    function getNotes() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveNotes(notes) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function renderNotes() {
      const notes = getNotes();
      // Remove all items except empty state
      const items = notesList.querySelectorAll('.note-item');
      items.forEach(item => item.remove());

      if (notes.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      notes.forEach((note, index) => {
        const li = document.createElement('li');
        li.className = 'note-item';
        
        const textSpan = document.createElement('span');
        textSpan.textContent = note.text;
        
        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = 'Hapus';
        delBtn.onclick = () => {
          const updated = getNotes();
          updated.splice(index, 1);
          saveNotes(updated);
          renderNotes();
        };

        li.appendChild(textSpan);
        li.appendChild(delBtn);
        notesList.appendChild(li);
      });
    }

    addBtn.onclick = () => {
      const text = noteInput.value.trim();
      if (!text) return;
      const notes = getNotes();
      notes.push({ text, id: Date.now() });
      saveNotes(notes);
      noteInput.value = '';
      renderNotes();
    };

    noteInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addBtn.onclick();
    });

    // Initial render
    renderNotes();
  </script>
</body>
</html>
